<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>VDuckie – Đang ngoại tuyến</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#111827;font:16px/1.55 Arial,"Segoe UI",sans-serif}.offline-card{width:min(440px,100%);padding:32px;text-align:center;background:#fff;border:2px solid #111827;border-radius:24px;box-shadow:8px 8px 0 #2563eb}.offline-card img{width:128px;height:128px;border-radius:28px}.offline-card h1{margin:18px 0 8px;font-size:1.6rem}.offline-card p{margin:0 0 20px;color:#475569}.offline-card button{border:0;border-radius:999px;padding:12px 22px;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="./assets/mascot/duckie-reader-icon-192.png" alt="Mascot VDuckie">
    <h1>VDuckie đang ngoại tuyến</h1>
    <p>Hãy kết nối Wi-Fi hoặc dữ liệu di động rồi thử lại để mở bài học và đồng bộ tiến độ của bạn.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
