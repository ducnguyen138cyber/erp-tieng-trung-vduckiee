<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5b928">
  <title>VDuckie – Đang ngoại tuyến</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f1e8;color:#18352e;font:16px/1.55 Arial,"Segoe UI",sans-serif}.offline-card{width:min(440px,100%);padding:32px;text-align:center;background:#fff;border:2px solid #18352e;border-radius:24px;box-shadow:8px 8px 0 #f5b928}.offline-card img{width:128px;height:128px;border-radius:28px}.offline-card h1{margin:18px 0 8px;font-size:1.6rem}.offline-card p{margin:0 0 20px;color:#5b6964}.offline-card button{border:0;border-radius:999px;padding:12px 22px;background:#18352e;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="./assets/pwa/vduckie-192.png" alt="Mascot VDuckie">
    <h1>VDuckie đang ngoại tuyến</h1>
    <p>Nội dung đã học vẫn có thể mở từ bộ nhớ đệm. Hãy kết nối mạng để đồng bộ Supabase và tải học liệu mới.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
