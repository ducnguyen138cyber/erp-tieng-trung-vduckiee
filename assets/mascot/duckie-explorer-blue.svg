<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" role="img" aria-labelledby="duckieTitle duckieDesc">
<title id="duckieTitle">Duckie - vịt thám hiểm học tiếng Trung</title><desc id="duckieDesc">Vịt trắng nhỏ má hồng đội mũ thám hiểm vàng và ôm sách tiếng Trung xanh dương, minh họa hoạt hình nét vẽ tay.</desc>
