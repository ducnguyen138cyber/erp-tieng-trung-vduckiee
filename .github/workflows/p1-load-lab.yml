name: P1 Public Load Lab
on:
  pull_request:
    paths:
      - 'tests/performance-low-end-lab.mjs'
      - '.github/workflows/p1-load-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright for the isolated public load audit
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Measure public production as guest on desktop and emulated low-end 4G mobile
        env:
          PERF_BASE_URL: https://vduckie.pages.dev/
        run: node tests/performance-low-end-lab.mjs
      - name: Upload JSON timings and real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-public-load-lab
          path: artifacts/performance/
          if-no-files-found: warn
