name: P1 Public Load Lab
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app-shell-v88.html'
      - 'hsk-lessons.js'
      - 'service-worker.js'
      - 'tests/hsk-stroke-lazy-load.test.mjs'
      - 'tests/performance-low-end-lab.mjs'
      - 'tests/performance-compare.mjs'
      - '.github/workflows/p1-load-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify lazy stroke loader without network or mock content in production
        run: node --test tests/hsk-stroke-lazy-load.test.mjs
      - name: Install Playwright for isolated load audit
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve PR base and candidate under identical local hosting
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach /tmp/vduckie-perf-base "$BASE_SHA"
          python3 -m http.server 4181 --bind 127.0.0.1 --directory /tmp/vduckie-perf-base >/tmp/vduckie-perf-base.log 2>&1 &
          python3 -m http.server 4182 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/vduckie-perf-candidate.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4181/ >/dev/null && curl --fail --silent http://127.0.0.1:4182/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4181/ >/dev/null
          curl --fail --silent http://127.0.0.1:4182/ >/dev/null
      - name: Measure base guest app in Chromium
        if: github.event_name == 'pull_request'
        env:
          PERF_BASE_URL: http://127.0.0.1:4181/
          PERF_ARTIFACT_DIR: artifacts/performance/before
        run: node tests/performance-low-end-lab.mjs
      - name: Measure candidate guest app with identical emulation
        if: github.event_name == 'pull_request'
        env:
          PERF_BASE_URL: http://127.0.0.1:4182/
          PERF_ARTIFACT_DIR: artifacts/performance/after
        run: node tests/performance-low-end-lab.mjs
      - name: Report before/after with no invented PASS threshold
        if: github.event_name == 'pull_request'
        run: node tests/performance-compare.mjs
      - name: Measure public production as guest (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          PERF_BASE_URL: https://vduckie.pages.dev/
          PERF_ARTIFACT_DIR: artifacts/performance/production
        run: node tests/performance-low-end-lab.mjs
      - name: Upload JSON timings and real Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-public-load-lab
          path: artifacts/performance/
          if-no-files-found: warn
