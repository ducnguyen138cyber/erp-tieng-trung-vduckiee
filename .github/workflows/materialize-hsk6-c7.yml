name: Materialize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  inspect-exercises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
      - name: Restore builder and inspect exercise source
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          python - <<'PY'
          from pathlib import Path
          lines = Path('scripts/build-hsk6-c7.py').read_text(encoding='utf-8').splitlines()
          for n in range(610 - 1, min(757, len(lines))):
              print(f'{n+1:05d}: {lines[n]}')
          PY
          exit 1
