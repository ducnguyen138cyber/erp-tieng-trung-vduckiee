name: Finalize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm recovery state
        run: |
          set -o pipefail
          git status -sb
          git status --porcelain
          git log --oneline --decorate -20
          git diff --stat d3c7bcef5a1625d21bcd8cba74bb65357c8dad48...HEAD
          git diff --check d3c7bcef5a1625d21bcd8cba74bb65357c8dad48...HEAD
          test "$(git branch --show-current)" = "agent/build-hsk6-c7"
          git merge-base --is-ancestor bb3cd6b44f2493d6295ff3654852350b8de4f8be HEAD
          test ! -f .git/MERGE_HEAD
          test ! -d .git/rebase-merge
          test ! -d .git/rebase-apply
      - name: Restore and patch deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-hsk6-c7.py')
          text = path.read_text(encoding='utf-8')
          exact = [
            ('        number = pinyin_number_from_tone(tone, simplified)\n        pos = parse_pos(rich.get("pos", ""))','        number = pinyin_number_from_tone(tone, simplified)\n        if official_headword == "凡（是）":\n            tone = "fán shì"\n            number = "fan2 shi4"\n        pos = parse_pos(rich.get("pos", ""))'),
            ('        meaning = clean_meaning(dictionary["senses"]) if dictionary else ""\n        if not meaning:','        meaning = clean_meaning(dictionary["senses"]) if dictionary else ""\n        meaning = {\n            "凡（是）": "hễ là; tất cả những trường hợp thuộc phạm vi đã nêu",\n            "新媒体": "truyền thông mới; các nền tảng truyền thông số tương tác",\n            "新能源": "năng lượng mới; nguồn năng lượng thay thế ít phụ thuộc nhiên liệu hóa thạch",\n        }.get(official_headword, meaning)\n        if not meaning:'),
            ('{"sourceId": CVDICT, "fields": ["traditional", "meaningVi"], "locator": item["simplified"]},','{"sourceId": CVDICT, "fields": ["traditional", "meaningVi"], "locator": f"CVDICT entry {item[\'simplified\']}"},'),
            ('            "order": lesson_idx + 1, "topic": unit[1], "titleZh": title_zh, "titleVi": title_vi,','            "order": local + 1, "topic": unit[1], "titleZh": title_zh, "titleVi": title_vi,'),
            ('item["simplified"], unit[2][local], item["officialRow"] - 3600)','item["simplified"], unit[3][local], item["officialRow"] - 3600)'),
            ('        context_zh = unit[6]\n        evidence_zh = unit[7]\n        title_zh, title_vi = unit[2][local], unit[3][local]','        title_zh, title_vi = unit[3][local], unit[4][local]\n        context_zh = "相关受众和决策者"\n        evidence_zh = f"围绕“{title_zh}”整理的材料、数据和访谈"'),
            ('f"Tạo một bản brief một trang cho {unit[6]}, có bảng nguồn, kết luận tạm thời và mốc复核。"','f"Tạo một bản brief một trang về “{title_vi}” cho {unit[6]}, có bảng nguồn, kết luận tạm thời và mốc复核。"'),
          ]
          for old, new in exact:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one patch target, got {count}: {old[:100]}')
              text = text.replace(old, new)
          for old, new in [
              ('điểm cần复核。', 'điểm cần kiểm tra lại.'),
              ('mốc复核。', 'mốc kiểm tra lại.'),
              ('–复核。', '– kiểm tra lại.'),
          ]:
              if old not in text:
                  raise SystemExit(f'Missing editorial target: {old}')
              text = text.replace(old, new)
          for old in [
              '"reviewStatus": "linguistic-reviewed"',
              '"reviewStatus": "pedagogy-reviewed"',
              '"reviewStatus": "blueprint-reviewed"',
          ]:
              if old not in text:
                  raise SystemExit(f'Missing review-status target: {old}')
              text = text.replace(old, '"reviewStatus": "unreviewed"')
          lines = text.splitlines()
          needle = '    runtime_text = runtime.read_text(encoding="utf-8")'
          if lines.count(needle) != 1:
              raise SystemExit(f'Runtime generator anchor mismatch: {lines.count(needle)}')
          index = lines.index(needle) + 1
          lines[index:index] = [
              '    runtime_text = runtime_text.replace(',
              '        "    var html = \'\';\\n    data.units.forEach",',
              '        "    var html = \'\';\\n    var midpointId = \'hsk\' + state.selectedLevel + \'-assessment-midpoint\';\\n    data.units.forEach")',
              '    runtime_text = runtime_text.replace(',
              '        "      var midpointId = \'hsk\' + state.selectedLevel + \'-assessment-midpoint\';\\n      if (Number(unit.order)",',
              '        "      if (Number(unit.order)")',
          ]
          text = '\n'.join(lines) + '\n'
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/build-hsk6-c7.py
      - name: Install build and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check pypinyin playwright
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )" >> "$GITHUB_ENV"
      - name: Materialize HSK6 corpus
        run: python scripts/build-hsk6-c7.py
      - name: Syntax gate
        run: |
          python -m py_compile scripts/build-hsk6-c7.py tests/hsk6-learner-browser-smoke.py
          find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validator gate
        run: node scripts/validate-hsk-content.js | tee /tmp/hsk6-validator.log
      - name: Duplicate gate
        run: node scripts/check-hsk-duplicates.js | tee /tmp/hsk6-duplicates.log
      - name: Coverage and provenance gate
        run: |
          node scripts/check-hsk-coverage.js | tee /tmp/hsk6-coverage.log
          node scripts/generate-hsk-report.js | tee /tmp/hsk6-reports.log
          node - <<'NODE'
          const fs=require('fs');
          const coverage=JSON.parse(fs.readFileSync('reports/hsk-coverage-report.json','utf8'));
          const source=JSON.parse(fs.readFileSync('reports/hsk-source-report.json','utf8'));
          const level=coverage.levels.find(x=>x.level===6);
          if(!level) throw new Error('HSK6 coverage missing');
          const expected={units:24,lessons:72,vocabulary:1800,grammar:50,characters:413,exercises:864,assessments:31};
          for(const [key,value] of Object.entries(expected)) if(level[key]!==value) throw new Error(`${key}: ${level[key]} !== ${value}`);
          if(level.missingSkills.length) throw new Error(`missingSkills: ${level.missingSkills}`);
          if(level.vocabularyIntroducedButNotPracticed.length) throw new Error(`unpracticed vocabulary: ${level.vocabularyIntroducedButNotPracticed.length}`);
          if(level.grammarWithoutExercise.length) throw new Error(`grammar without exercise: ${level.grammarWithoutExercise.length}`);
          if(source.automaticProductionGate!=='blocked') throw new Error(`source review gate must remain blocked until human signoff: ${source.automaticProductionGate}`);
          if(!Array.isArray(source.usedReviewRequiredSources)||!source.usedReviewRequiredSources.length) throw new Error('review-required provenance list missing');
          console.log(JSON.stringify({hsk6:level,sourceGate:source.automaticProductionGate,usedReviewRequiredSources:source.usedReviewRequiredSources},null,2));
          NODE
      - name: HSK6 targeted and learner integration gates
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/hsk6-c7-quality.test.js | tee /tmp/hsk6-targeted.log
          find tests -maxdepth 1 -type f \( -name '*learner*integration*.test.js' -o -name 'hsk6-c7-quality.test.js' \) -print0 | sort -z | xargs -0 node --test --test-concurrency=1 | tee /tmp/hsk6-integration.log
      - name: HSK6 browser smoke gate
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/hsk6-learner-browser-smoke.test.js | tee /tmp/hsk6-browser.log
      - name: Full regression gate
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/*.test.js | tee /tmp/full-regression.log
      - name: Deterministic report and whitespace gates
        run: |
          sha256sum reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json reports/hsk1-phase2a-report.json > /tmp/reports-before.sha
          node scripts/generate-hsk-report.js > /tmp/hsk6-reports-second.log
          sha256sum reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json reports/hsk1-phase2a-report.json > /tmp/reports-after.sha
          diff -u /tmp/reports-before.sha /tmp/reports-after.sha
          git diff --check
      - name: Cleanup recovery artifacts
        run: |
          rm -rf scripts/.hsk6-c7-bootstrap
          rm -f .github/workflows/materialize-hsk6-c7.yml
          rm -rf .tmp .pytest_cache .mypy_cache test-results playwright-report
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test ! -e scripts/.hsk6-c7-bootstrap
          test ! -e .github/workflows/materialize-hsk6-c7.yml
          if git status --porcelain | grep -E '(\.tmp/|bootstrap|diagnostic|test-results|playwright-report|__pycache__|\.pyc$|\.log$)'; then
            echo 'Temporary recovery artifact remains in final diff' >&2
            exit 1
          fi
          git diff --check
      - name: Commit and push final branch
        run: |
          git config user.name "VDuckie Curriculum Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build professional HSK 6 course"
          git push origin HEAD:agent/build-hsk6-c7
          git fetch origin agent/build-hsk6-c7
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/build-hsk6-c7)"
          test -z "$(git status --porcelain)"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git show --stat --oneline --decorate --summary HEAD
