name: Finalize HSK6 C7 Sharded

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  regression:
    name: regression-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore reviewed C7 source
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
          python scripts/.hsk6-c7-apply-fixes.py
          python -m py_compile scripts/build-hsk6-c7.py
      - name: Install full regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --disable-pip-version-check pypinyin playwright
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )" >> "$GITHUB_ENV"
          identify -version
      - name: Materialize exact reviewed HSK6 output
        run: python scripts/build-hsk6-c7.py
      - name: Syntax gate
        run: |
          python -m py_compile scripts/build-hsk6-c7.py tests/hsk6-learner-browser-smoke.py
          find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full regression shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: 4
        run: |
          set -o pipefail
          mapfile -t ALL_TESTS < <(find tests -maxdepth 1 -type f -name '*.test.js' | sort)
          mapfile -t SHARD_TESTS < <(printf '%s\n' "${ALL_TESTS[@]}" | awk -v shard="$SHARD" -v total="$TOTAL_SHARDS" '((NR-1)%total)==shard')
          echo "all_test_files=${#ALL_TESTS[@]} shard=$SHARD selected=${#SHARD_TESTS[@]}"
          printf '%s\n' "${SHARD_TESTS[@]}"
          test "${#ALL_TESTS[@]}" -gt 0
          test "${#SHARD_TESTS[@]}" -gt 0
          node --test --test-concurrency=1 "${SHARD_TESTS[@]}" | tee "/tmp/full-regression-shard-${SHARD}.log"

  finalize:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm branch recovery state
        run: |
          git status -sb
          test "$(git branch --show-current)" = "agent/build-hsk6-c7"
          git merge-base --is-ancestor bb3cd6b44f2493d6295ff3654852350b8de4f8be HEAD
          test ! -f .git/MERGE_HEAD
          test ! -d .git/rebase-merge
          test ! -d .git/rebase-apply
          git diff --check d3c7bcef5a1625d21bcd8cba74bb65357c8dad48...HEAD
      - name: Restore reviewed C7 source
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
          python scripts/.hsk6-c7-apply-fixes.py
          python -m py_compile scripts/build-hsk6-c7.py
      - name: Install builder dependency
        run: python -m pip install --disable-pip-version-check pypinyin
      - name: Materialize final HSK6 tree
        run: python scripts/build-hsk6-c7.py
      - name: Final syntax and validator gates
        run: |
          python -m py_compile scripts/build-hsk6-c7.py tests/hsk6-learner-browser-smoke.py
          find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/validate-hsk-content.js | tee /tmp/hsk6-final-validator.log
      - name: Deterministic reports, duplicate, coverage and provenance gates
        run: |
          set -o pipefail
          node scripts/generate-hsk-report.js | tee /tmp/hsk6-final-reports-first.log
          node - <<'NODE'
          const fs=require('fs');
          const quality=JSON.parse(fs.readFileSync('reports/hsk-quality-report.json','utf8'));
          const duplicate=JSON.parse(fs.readFileSync('reports/hsk-duplication-report.json','utf8'));
          const coverage=JSON.parse(fs.readFileSync('reports/hsk-coverage-report.json','utf8'));
          const source=JSON.parse(fs.readFileSync('reports/hsk-source-report.json','utf8'));
          const level=coverage.levels.find(x=>x.level===6);
          if(!level) throw new Error('HSK6 coverage missing');
          const expected={units:24,lessons:72,vocabulary:1800,grammar:50,characters:413,exercises:864,assessments:31};
          for(const [key,value] of Object.entries(expected)) if(level[key]!==value) throw new Error(`${key}: ${level[key]} !== ${value}`);
          if(quality.validation.errors!==0||quality.validation.warnings!==0) throw new Error(`validation ${JSON.stringify(quality.validation)}`);
          if(duplicate.summary.blockers!==0) throw new Error(`duplicate blockers ${duplicate.summary.blockers}`);
          if(level.missingSkills.length) throw new Error(`missingSkills ${level.missingSkills}`);
          if(level.vocabularyIntroducedButNotPracticed.length) throw new Error(`unpracticed vocabulary ${level.vocabularyIntroducedButNotPracticed.length}`);
          if(level.grammarWithoutExercise.length) throw new Error(`grammar without exercise ${level.grammarWithoutExercise.length}`);
          if(source.automaticProductionGate!=='blocked') throw new Error(`source review gate ${source.automaticProductionGate}`);
          if(!Array.isArray(source.usedReviewRequiredSources)||!source.usedReviewRequiredSources.length) throw new Error('review-required provenance missing');
          console.log(JSON.stringify({validation:quality.validation,duplicates:duplicate.summary,hsk6:level,sourceGate:source.automaticProductionGate,usedReviewRequiredSources:source.usedReviewRequiredSources},null,2));
          NODE
          sha256sum reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json reports/hsk1-phase2a-report.json > /tmp/reports-before.sha
          node scripts/generate-hsk-report.js > /tmp/hsk6-final-reports-second.log
          sha256sum reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json reports/hsk1-phase2a-report.json > /tmp/reports-after.sha
          diff -u /tmp/reports-before.sha /tmp/reports-after.sha
          git diff --check
      - name: Cleanup all C7 recovery artifacts
        run: |
          rm -rf scripts/.hsk6-c7-bootstrap
          rm -f scripts/.hsk6-c7-apply-fixes.py
          rm -f .github/workflows/materialize-hsk6-c7.yml
          rm -rf .tmp .pytest_cache .mypy_cache test-results playwright-report
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test ! -e scripts/.hsk6-c7-bootstrap
          test ! -e scripts/.hsk6-c7-apply-fixes.py
          test ! -e .github/workflows/materialize-hsk6-c7.yml
          if git status --porcelain | grep -E '(\.tmp/|bootstrap|apply-fixes|diagnostic|test-results|playwright-report|__pycache__|\.pyc$|\.log$)'; then
            echo 'Temporary recovery artifact remains in final diff' >&2
            exit 1
          fi
          git diff --check
      - name: Commit and push final C7 branch
        run: |
          git config user.name "VDuckie Curriculum Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build professional HSK 6 course"
          git push origin HEAD:agent/build-hsk6-c7
          git fetch origin agent/build-hsk6-c7
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/build-hsk6-c7)"
          test -z "$(git status --porcelain)"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git show --stat --oneline --decorate --summary HEAD
