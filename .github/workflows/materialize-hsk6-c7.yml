name: Materialize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - name: Restore deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          python -m py_compile scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
      - name: Inspect validation targets
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/build-hsk6-c7.py').read_text(encoding='utf-8')
          needles = [
              '"order": lesson_no',
              "'order': lesson_no",
              'sourceRefs',
              'pinyinTone',
              'missingMeanings',
              'meaningVi',
              '凡（是）',
          ]
          lines = text.splitlines()
          seen = set()
          for needle in needles:
              print(f'===== NEEDLE: {needle} =====')
              for i, line in enumerate(lines):
                  if needle in line:
                      start = max(0, i - 8)
                      end = min(len(lines), i + 12)
                      key = (start, end)
                      if key in seen:
                          continue
                      seen.add(key)
                      for n in range(start, end):
                          print(f'{n+1:05d}: {lines[n]}')
                      print()
          PY
          exit 1
