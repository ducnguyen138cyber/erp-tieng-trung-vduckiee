name: Materialize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          python -m py_compile scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
      - name: Install builder dependency
        run: python -m pip install --disable-pip-version-check pypinyin
      - name: Build HSK6 corpus
        run: python scripts/build-hsk6-c7.py
      - name: Check generated syntax
        run: |
          python -m py_compile scripts/build-hsk6-c7.py tests/hsk6-learner-browser-smoke.py
          find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate HSK content
        run: node scripts/validate-hsk-content.js
      - name: Check HSK duplicates
        run: node scripts/check-hsk-duplicates.js
      - name: Check HSK coverage
        run: node scripts/check-hsk-coverage.js
      - name: Generate deterministic reports
        run: node scripts/generate-hsk-report.js
      - name: Run HSK6 targeted tests
        run: node --test --test-concurrency=1 tests/hsk6-c7-quality.test.js
      - name: Verify diff
        run: git diff --check
      - name: Commit materialized course
        run: |
          rm -rf scripts/.hsk6-c7-bootstrap
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize professional HSK 6 course"
          git push origin HEAD:agent/build-hsk6-c7
