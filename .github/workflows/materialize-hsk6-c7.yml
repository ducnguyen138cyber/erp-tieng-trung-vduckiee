name: Materialize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - name: Restore deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          python -m py_compile scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
      - name: Inspect record construction
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('scripts/build-hsk6-c7.py').read_text(encoding='utf-8').splitlines()
          for start, end, title in [
              (360, 430, 'vocabulary parsing'),
              (610, 760, 'lesson construction'),
              (1, 180, 'helpers and constants'),
          ]:
              print(f'===== {title} {start}-{end} =====')
              for n in range(start - 1, min(end, len(lines))):
                  print(f'{n+1:05d}: {lines[n]}')
          PY
          exit 1
