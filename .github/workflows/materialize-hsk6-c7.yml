name: Materialize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore and patch deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-hsk6-c7.py')
          text = path.read_text(encoding='utf-8')
          exact_patches = [
              ('        number = pinyin_number_from_tone(tone, simplified)\n        pos = parse_pos(rich.get("pos", ""))',
               '        number = pinyin_number_from_tone(tone, simplified)\n        if official_headword == "凡（是）":\n            tone = "fán shì"\n            number = "fan2 shi4"\n        pos = parse_pos(rich.get("pos", ""))'),
              ('        meaning = clean_meaning(dictionary["senses"]) if dictionary else ""\n        if not meaning:',
               '        meaning = clean_meaning(dictionary["senses"]) if dictionary else ""\n        meaning = {\n            "凡（是）": "hễ là; tất cả những trường hợp thuộc phạm vi đã nêu",\n            "新媒体": "truyền thông mới; các nền tảng truyền thông số tương tác",\n            "新能源": "năng lượng mới; nguồn năng lượng thay thế ít phụ thuộc nhiên liệu hóa thạch",\n        }.get(official_headword, meaning)\n        if not meaning:'),
              ('{"sourceId": CVDICT, "fields": ["traditional", "meaningVi"], "locator": item["simplified"]},',
               '{"sourceId": CVDICT, "fields": ["traditional", "meaningVi"], "locator": f"CVDICT entry {item[\'simplified\']}"},'),
              ('            "order": lesson_idx + 1, "topic": unit[1], "titleZh": title_zh, "titleVi": title_vi,',
               '            "order": local + 1, "topic": unit[1], "titleZh": title_zh, "titleVi": title_vi,'),
              ('item["simplified"], unit[2][local], item["officialRow"] - 3600)',
               'item["simplified"], unit[3][local], item["officialRow"] - 3600)'),
              ('        context_zh = unit[6]\n        evidence_zh = unit[7]\n        title_zh, title_vi = unit[2][local], unit[3][local]',
               '        title_zh, title_vi = unit[3][local], unit[4][local]\n        context_zh = "相关受众和决策者"\n        evidence_zh = f"围绕“{title_zh}”整理的材料、数据和访谈"'),
          ]
          for old, new in exact_patches:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one patch target, got {count}: {old[:90]}')
              text = text.replace(old, new)
          replacements = [
              ('điểm cần复核。', 'điểm cần kiểm tra lại.'),
              ('mốc复核。', 'mốc kiểm tra lại.'),
              ('–复核。', '– kiểm tra lại.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing editorial target: {old}')
              text = text.replace(old, new)
          review_replacements = [
              ('"reviewStatus": "linguistic-reviewed"', '"reviewStatus": "unreviewed"'),
              ('"reviewStatus": "pedagogy-reviewed"', '"reviewStatus": "unreviewed"'),
              ('"reviewStatus": "blueprint-reviewed"', '"reviewStatus": "unreviewed"'),
          ]
          for old, new in review_replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'Missing review-status target: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/build-hsk6-c7.py
      - name: Install builder dependency
        run: python -m pip install --disable-pip-version-check pypinyin
      - name: Build HSK6 corpus
        run: python scripts/build-hsk6-c7.py
      - name: Check generated syntax
        run: |
          python -m py_compile scripts/build-hsk6-c7.py tests/hsk6-learner-browser-smoke.py
          find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate HSK content
        run: node scripts/validate-hsk-content.js
      - name: Check HSK duplicates
        run: node scripts/check-hsk-duplicates.js
      - name: Check coverage and provenance
        run: |
          node scripts/check-hsk-coverage.js
          node scripts/generate-hsk-report.js
      - name: Run HSK6 targeted tests
        run: node --test --test-concurrency=1 tests/hsk6-c7-quality.test.js
      - name: Verify deterministic reports and diff
        run: |
          sha256sum reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json > /tmp/reports-before.sha
          node scripts/generate-hsk-report.js
          sha256sum reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json > /tmp/reports-after.sha
          diff -u /tmp/reports-before.sha /tmp/reports-after.sha
          git diff --check
