name: Materialize HSK6 C7

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: write

jobs:
  inspect-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore and patch deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-hsk6-c7.py')
          text = path.read_text(encoding='utf-8')
          patches = [
              ('        number = pinyin_number_from_tone(tone, simplified)\n        pos = parse_pos(rich.get("pos", ""))','        number = pinyin_number_from_tone(tone, simplified)\n        if official_headword == "凡（是）":\n            tone = "fán shì"\n            number = "fan2 shi4"\n        pos = parse_pos(rich.get("pos", ""))'),
              ('        meaning = clean_meaning(dictionary["senses"]) if dictionary else ""\n        if not meaning:','        meaning = clean_meaning(dictionary["senses"]) if dictionary else ""\n        meaning = {\n            "凡（是）": "hễ là; tất cả những trường hợp thuộc phạm vi đã nêu",\n            "新媒体": "truyền thông mới; các nền tảng truyền thông số tương tác",\n            "新能源": "năng lượng mới; nguồn năng lượng thay thế ít phụ thuộc nhiên liệu hóa thạch",\n        }.get(official_headword, meaning)\n        if not meaning:'),
              ('{"sourceId": CVDICT, "fields": ["traditional", "meaningVi"], "locator": item["simplified"]},','{"sourceId": CVDICT, "fields": ["traditional", "meaningVi"], "locator": f"CVDICT entry {item[\'simplified\']}"},'),
              ('            "order": lesson_idx + 1, "topic": unit[1], "titleZh": title_zh, "titleVi": title_vi,','            "order": local + 1, "topic": unit[1], "titleZh": title_zh, "titleVi": title_vi,'),
          ]
          for old, new in patches:
              if text.count(old) != 1: raise SystemExit(f'bad patch target: {old[:60]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install and build
        run: |
          python -m pip install --disable-pip-version-check pypinyin
          python scripts/build-hsk6-c7.py
      - name: Inspect duplicate blockers
        run: |
          set +e
          node scripts/check-hsk-duplicates.js
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/hsk-duplication-report.json','utf8'));
          const blockers = (report.findings || []).filter(x => x.severity === 'blocker' || x.blocking === true || x.status === 'blocker');
          console.log('REPORT_KEYS', Object.keys(report));
          console.log('FINDING_KEYS', Object.keys((report.findings || [])[0] || {}));
          console.log('BLOCKERS_FOUND', blockers.length);
          console.log('FIRST_FINDINGS', JSON.stringify((report.findings || []).slice(0,40), null, 2));
          const groups = new Map();
          for (const f of blockers) {
            const key = [f.kind, f.type, f.field, f.fieldPath, f.value, f.normalized].filter(Boolean).join(' | ');
            groups.set(key, (groups.get(key)||0)+1);
          }
          console.log('BLOCKER_GROUPS', JSON.stringify([...groups.entries()].sort((a,b)=>b[1]-a[1]).slice(0,100), null, 2));
          NODE
          exit "$status"
