name: Inspect HSK6 Runtime Generator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-hsk6-c7
    paths:
      - '.github/workflows/materialize-hsk6-c7.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-hsk6-c7
          fetch-depth: 0
      - name: Restore deterministic C7 builder
        run: |
          cat scripts/.hsk6-c7-bootstrap/part*.b64 | base64 --decode | gzip --decompress > scripts/build-hsk6-c7.py
          test "$(wc -c < scripts/build-hsk6-c7.py)" -eq 115848
          python -m py_compile scripts/build-hsk6-c7.py
      - name: Inspect midpoint generator context
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('scripts/build-hsk6-c7.py').read_text(encoding='utf-8').splitlines()
          hits=[i for i,line in enumerate(lines) if 'midpointId' in line or 'renderSidebar' in line]
          print('hits', [x+1 for x in hits])
          emitted=set()
          for i in hits:
              start=max(0,i-18); end=min(len(lines),i+24)
              if (start,end) in emitted: continue
              emitted.add((start,end))
              print(f'===== {start+1}-{end} =====')
              for n in range(start,end): print(f'{n+1:05d}: {lines[n]}')
          if not hits: raise SystemExit('midpointId not found in builder')
          PY
          exit 1
