name: Verify deployed VDuckie visuals
on:
  push:
    branches: [main]
    paths:
      - 'assets/design-system/**'
      - 'assets/mascot/**'
      - 'index.html'
      - 'app-shell-v88.html'
      - 'service-worker.js'
      - 'pwa-register.js'
      - 'tests/brand-runtime-browser.mjs'
      - 'tests/helpers/visual-audit.mjs'
      - '.github/workflows/brand-production-audit.yml'
permissions:
  contents: read
  checks: read
jobs:
  immutable-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Resolve the successful Cloudflare deployment for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<30; attempt++) {
              const {data}=await github.rest.checks.listForRef({...context.repo,ref:context.sha});
              const check=data.check_runs.find(c=>c.name==='Cloudflare Pages'&&c.head_sha===context.sha);
              if(check?.conclusion==='failure')throw new Error('Cloudflare deployment failed');
              const url=check?.output?.summary?.match(/https:\/\/[a-z0-9]+\.vduckie\.pages\.dev/)?.[0];
              if(check?.conclusion==='success'&&url){
                core.exportVariable('VISUAL_BASE_URL',url+'/');
                core.info('Auditing immutable deployment: '+url);
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('No successful immutable Cloudflare deployment found for '+context.sha);
      - name: Audit real desktop/mobile paint, requests, Service Worker and cache
        run: node tests/brand-runtime-browser.mjs
      - name: Save deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-visuals
          path: artifacts/brand-runtime/
          if-no-files-found: ignore
