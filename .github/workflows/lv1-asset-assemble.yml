name: Assemble Level 1 asset once

on:
  push:
    branches:
      - fix/implement-level1-vduckie-asset
    paths:
      - .github/workflows/lv1-asset-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/implement-level1-vduckie-asset
          fetch-depth: 0

      - name: Assemble and verify production WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vduckie/lv1/v109
          cat .tmp/lv1-asset/part-*.b64 | base64 -d > assets/vduckie/lv1/v109/newborn-vduckie-hatching.webp
          echo 'b330eca7a4f64bc96d502ab1afd258f654b145b9e68ec44a778922209e5f9b76  assets/vduckie/lv1/v109/newborn-vduckie-hatching.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/vduckie/lv1/v109/newborn-vduckie-hatching.webp')
          data = p.read_bytes()
          assert len(data) == 27678, len(data)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          assert data[12:16] == b'VP8L' and data[20] == 0x2f
          bits = int.from_bytes(data[21:25], 'little')
          width = (bits & 0x3fff) + 1
          height = ((bits >> 14) & 0x3fff) + 1
          alpha = bool(bits & (1 << 28))
          assert (width, height, alpha) == (320, 320, True), (width, height, alpha)
          print(f'WebP verified: {width}x{height}, alpha={alpha}, bytes={len(data)}')
          PY

      - name: Run Level 1 tests and source checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/v109/level1-manifest-v109.js
          node --check assets/v109/vduckie-level1-v109.js
          node --check tests/v109-level1-evolution.test.js
          node --test tests/v109-level1-evolution.test.js
          git diff --check

      - name: Commit final asset and remove temporary assembly files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/lv1-asset
          rm -f .github/workflows/lv1-asset-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vduckie/lv1/v109/newborn-vduckie-hatching.webp .tmp/lv1-asset .github/workflows/lv1-asset-assemble.yml
          git commit -m 'Finalize Level 1 VDuckie asset'
          git push origin HEAD:fix/implement-level1-vduckie-asset
