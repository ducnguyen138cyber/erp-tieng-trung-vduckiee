name: HSK Content Quality

on:
  pull_request:
    paths:
      - 'data/hsk/**'
      - 'assets/hsk-content/**'
      - 'scripts/*hsk*'
      - 'tests/*hsk*'
      - 'docs/hsk-*'
      - 'reports/hsk-*'
      - '.tmp/**'
      - '.github/workflows/hsk-content-quality.yml'
  push:
    branches: [main]
    paths:
      - 'data/hsk/**'
      - 'assets/hsk-content/**'
      - 'scripts/*hsk*'
      - 'tests/*hsk*'
      - 'docs/hsk-*'
      - 'reports/hsk-*'
      - '.github/workflows/hsk-content-quality.yml'

permissions:
  contents: write

jobs:
  validate-hsk-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and connect HSK4 C5 corpus
        run: |
          python -m pip install --disable-pip-version-check pypinyin
          cat .tmp/c5-builder.part00a .tmp/c5-builder.part00b .tmp/c5-builder.part00c .tmp/c5-builder.part00d \
              .tmp/c5-builder.part01 .tmp/c5-builder.part02 .tmp/c5-builder.part03 > /tmp/c5-builder.b64
          echo '98622bf4182eacb1636e5d7286130cae04b6f8a3568b9e06ff1ba57af09cafd1  /tmp/c5-builder.b64' | sha256sum --check
          base64 --decode /tmp/c5-builder.b64 | gzip --decompress > scripts/build-hsk4-c5.py
          echo '62407e74f4d10609c518c9c69d6331b47115459d68e36362ae57a9fe7d948cbc  scripts/build-hsk4-c5.py' | sha256sum --check
          chmod +x scripts/build-hsk4-c5.py
          python scripts/build-hsk4-c5.py
          python scripts/finalize-hsk4-c5.py
          python scripts/finalize-hsk4-editorial.py
          python scripts/finalize-hsk4-integration.py
      - name: Commit generated HSK4 corpus and learner integration
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-hsk4-c5.py data/hsk/manifest.json data/hsk/sources.json data/hsk/hsk4 \
            assets/hsk-content/hsk-professional-runtime.js assets/hsk-content/hsk-content-feature-flags.js \
            tests/hsk-phase1-quality.test.js
          git commit -m 'Finalize professional HSK4 corpus and integration'
          git push origin HEAD:${{ github.head_ref }}
      - name: Install full regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Check HSK and test JavaScript syntax
        run: find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate HSK content
        run: node scripts/validate-hsk-content.js
      - name: Diagnose exact duplicate groups
        run: |
          node <<'NODE'
          const { validateRepository, collectDuplicateCandidates } = require('./scripts/hsk-duplicate-engine');
          const repository = validateRepository(process.cwd()).repository;
          const candidates = collectDuplicateCandidates(repository);
          const groups = new Map();
          for (const item of candidates) {
            const scope = item.record.contentStatus === 'fixture' ? 'fixture' : 'canonical';
            const key = `${scope}|${item.kind}|${String(item.text).trim()}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(item);
          }
          const duplicates = [...groups.values()]
            .filter(items => items.length > 1)
            .map(items => ({
              kind: items[0].kind,
              text: String(items[0].text),
              count: items.length,
              pairBlockers: items.length * (items.length - 1) / 2,
              ids: items.map(item => item.id),
              levels: [...new Set(items.map(item => item.level))]
            }))
            .sort((a, b) => b.pairBlockers - a.pairBlockers || b.count - a.count);
          console.log(JSON.stringify({
            groupCount: duplicates.length,
            pairBlockers: duplicates.reduce((sum, item) => sum + item.pairBlockers, 0),
            byKind: duplicates.reduce((result, item) => {
              result[item.kind] = (result[item.kind] || 0) + item.pairBlockers;
              return result;
            }, {}),
            groups: duplicates.slice(0, 40)
          }, null, 2));
          NODE
      - name: Check HSK duplicates
        run: node scripts/check-hsk-duplicates.js
      - name: Check HSK coverage
        run: node scripts/check-hsk-coverage.js
      - name: Generate deterministic HSK reports
        run: node scripts/generate-hsk-report.js
      - name: Commit deterministic reports
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json reports/hsk1-phase2a-report.json
          git commit -m 'Update HSK4 deterministic reports'
          git push origin HEAD:${{ github.head_ref }}
      - name: Run all website regression tests
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=dot tests/*.test.js > /tmp/regression.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== FAILED TEST NAMES ==='
            grep -E '^✖ ' /tmp/regression.log || true
            echo '=== REGRESSION LOG TAIL ==='
            tail -n 300 /tmp/regression.log
          else
            cat /tmp/regression.log
          fi
          exit "$status"
      - name: Upload regression failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-regression-failure
          path: /tmp/regression.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify whitespace and deterministic reports
        run: |
          git diff --check
          git diff --exit-code -- reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json
