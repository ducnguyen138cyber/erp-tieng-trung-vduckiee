name: HSK Content Quality

on:
  pull_request:
    paths:
      - 'data/hsk/**'
      - 'assets/hsk-content/**'
      - 'scripts/*hsk*'
      - 'tests/*hsk*'
      - 'docs/hsk-*'
      - 'reports/hsk-*'
      - '.github/workflows/hsk-content-quality.yml'
  push:
    branches: [main]
    paths:
      - 'data/hsk/**'
      - 'assets/hsk-content/**'
      - 'scripts/*hsk*'
      - 'tests/*hsk*'
      - 'docs/hsk-*'
      - 'reports/hsk-*'
      - '.github/workflows/hsk-content-quality.yml'

permissions:
  contents: write

jobs:
  validate-hsk-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install full regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Check HSK and test JavaScript syntax
        run: find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate HSK content
        run: node scripts/validate-hsk-content.js
      - name: Check HSK duplicates
        run: node scripts/check-hsk-duplicates.js
      - name: Check HSK coverage
        run: node scripts/check-hsk-coverage.js
      - name: Generate deterministic HSK reports
        run: node scripts/generate-hsk-report.js
      - name: Finalize deterministic HSK4 reports
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/build-hsk4-c5'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/hsk-content-quality.yml
          git add reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json .github/workflows/hsk-content-quality.yml
          git diff --cached --check
          git commit -m "Finalize deterministic HSK4 reports"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Run all website regression tests
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=dot tests/*.test.js > /tmp/regression.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== FAILED TEST NAMES ==='
            grep -E '^✖ ' /tmp/regression.log || true
            echo '=== REGRESSION LOG TAIL ==='
            tail -n 300 /tmp/regression.log
          else
            cat /tmp/regression.log
          fi
          exit "$status"
      - name: Upload regression failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-regression-failure
          path: /tmp/regression.log
          if-no-files-found: error
          retention-days: 3
      - name: Verify whitespace and deterministic reports
        run: |
          git diff --check
          git diff --exit-code -- reports/hsk-quality-report.json reports/hsk-coverage-report.json reports/hsk-duplication-report.json reports/hsk-source-report.json
