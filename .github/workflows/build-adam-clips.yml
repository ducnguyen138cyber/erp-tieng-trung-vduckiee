name: Level 1 production verification

on:
  push:
    branches:
      - agent/lv1-maintenance-v109
    paths:
      - '.github/workflows/build-adam-clips.yml'

permissions:
  contents: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm deployed main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/lv1-maintenance-v109
          test "$(git rev-parse HEAD)" = "158de762e785b73b38a57d92fdd45880739a3623"
          test "$(git rev-parse origin/main)" = "158de762e785b73b38a57d92fdd45880739a3623"
          test -z "$(git status --porcelain)"

      - name: Wait for production HTML bootstrap
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            html="$(curl -fsS -H 'Cache-Control: no-cache' "https://vduckie.pages.dev/?lv1V109=$i-$(date +%s)")"
            if grep -q 'vduckie-level1-v109.js?v=109.0' <<<"$html" && \
               grep -q 'level1-manifest-v109.js?v=109.0' <<<"$html" && \
               grep -q 'vduckie-level1-v109.css?v=109.0' <<<"$html"; then
              echo "Production HTML contains V109 bootstrap"
              exit 0
            fi
            sleep 5
          done
          echo "Production HTML did not expose V109 bootstrap within timeout"
          exit 1

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lv1-pw
          cd /tmp/lv1-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run production four-viewport smoke
        shell: bash
        env:
          NODE_PATH: /tmp/lv1-pw/node_modules
        run: |
          set -euo pipefail
          git show origin/agent/lv1-maintenance-v109:scripts/lv1-smoke-v109.js > /tmp/lv1-smoke.js
          node --check /tmp/lv1-smoke.js
          BASE_URL=https://vduckie.pages.dev/ node /tmp/lv1-smoke.js production

      - name: Record successful production verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/lv1-maintenance-v109
          git switch -C agent/lv1-maintenance-v109 origin/agent/lv1-maintenance-v109
          git config user.name "VDuckie Verification Agent"
          git config user.email "actions@users.noreply.github.com"
          cat > level1-v109-production-pass.txt <<EOF
          main=158de762e785b73b38a57d92fdd45880739a3623
          production=https://vduckie.pages.dev
          htmlBootstrap=pass
          viewport1440x900=pass
          viewport1024x768=pass
          viewport390x844=pass
          viewport320x568=pass
          exp0=resting
          exp25=first-crack
          exp50=peek
          exp75=ready
          exp99=ready
          exp100=level2
          EOF
          git add level1-v109-production-pass.txt
          git commit -m "Record Level 1 V109 production smoke pass"
          git push origin HEAD:agent/lv1-maintenance-v109

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level1-v109-production-evidence
          retention-days: 5
          if-no-files-found: warn
          path: |
            /tmp/lv1-production.json
            /tmp/lv1-production-*.png
