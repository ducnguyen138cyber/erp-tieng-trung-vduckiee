name: Build CVDICT dictionary shards
on:
  workflow_dispatch:
  push:
    branches:
      - feat/dictionary-cvdict-expand
    paths:
      - .github/workflows/build-cvdict-dictionary.yml
      - scripts/build-cvdict-index.mjs
      - tests/dictionary-cvdict.test.mjs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/search/header-chinese-search.js
          node --check assets/search/dictionary-expanded.js
          node --check scripts/build-cvdict-index.mjs
      - name: Verify parser, shard layout and search normalization
        run: node --test tests/dictionary-cvdict.test.mjs
      - name: Download licensed CVDICT and write 122k+ dictionary shards
        run: node scripts/build-cvdict-index.mjs
      - name: Commit generated static search corpus to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dictionary/cvdict-v1/
          if ! git diff --cached --quiet; then
            git commit -m "data(dictionary): generate licensed full CVDICT search corpus"
            git push
          fi
