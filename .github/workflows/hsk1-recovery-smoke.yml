name: HSK1 recovery smoke

on:
  push:
    branches:
      - agent/hsk1-c2-recovery-smoke

permissions:
  contents: read

jobs:
  verify-main-hsk1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d1fa350319593266b3ae3837360f785a509ae60
          fetch-depth: 0

      - name: Recovery baseline and clean tree
        shell: bash
        run: |
          set -euo pipefail
          git status -sb
          git status --porcelain
          git branch --show-current || true
          git remote -v
          git fetch --all --prune
          git log --oneline --decorate -30
          test "$(git rev-parse HEAD)" = "5d1fa350319593266b3ae3837360f785a509ae60"
          test "$(git rev-parse origin/main)" = "5d1fa350319593266b3ae3837360f785a509ae60"
          test -z "$(git status --porcelain)"

      - name: HSK content, coverage, duplicate and course gates
        shell: bash
        run: |
          set -euo pipefail
          find assets/hsk-content scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/validate-hsk-content.js
          node scripts/check-hsk-duplicates.js
          node scripts/check-hsk-coverage.js
          node scripts/generate-hsk-report.js
          node --test \
            tests/hsk-learner-c2-integration.test.js \
            tests/hsk-phase-c2-editorial-quality.test.js \
            tests/hsk-phase-c1-professional-course.test.js \
            tests/hsk-phase2a-contract.test.js \
            tests/hsk-phase2a-quality.test.js \
            tests/hsk-phase2a-lock.test.js
          git diff --check
          git diff --exit-code -- \
            reports/hsk-quality-report.json \
            reports/hsk-coverage-report.json \
            reports/hsk-duplication-report.json \
            reports/hsk-source-report.json

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hsk-pw
          cd /tmp/hsk-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Four-viewport learner smoke on main source and production
        shell: bash
        env:
          NODE_PATH: /tmp/hsk-pw/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hsk-recovery-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done

          cat >/tmp/hsk-recovery-smoke.js <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const targets = [
            { name: 'local', base: 'http://127.0.0.1:4173/' },
            { name: 'production', base: 'https://vduckie.pages.dev/' }
          ];
          const viewports = [
            { name: 'desktop-1440x900', width: 1440, height: 900, mobile: false },
            { name: 'tablet-1024x768', width: 1024, height: 768, mobile: false },
            { name: 'mobile-390x844', width: 390, height: 844, mobile: true },
            { name: 'mobile-320x568', width: 320, height: 568, mobile: true }
          ];
          const expected = { units: 10, lessons: 24, grammar: 21, characters: 50, exercises: 120, assessments: 13, vocabulary: 300 };
          const report = { commit: '5d1fa350319593266b3ae3837360f785a509ae60', targets: {}, failures: [] };

          function fail(message) { throw new Error(message); }
          async function waitReady(page) {
            await page.waitForFunction(() => document.body && document.body.getAttribute('data-hsk-prof-ready') === 'true', null, { timeout: 30000 });
            return page.evaluate(() => window.VDuckieHskProfessionalRuntime && window.VDuckieHskProfessionalRuntime.getState());
          }
          async function assertCore(page, label) {
            const state = await waitReady(page);
            if (!state || !state.mounted || state.status !== 'ready') fail(label + ': runtime not ready');
            if (state.readOnly !== true || state.progressWritesEnabled !== false) fail(label + ': unsafe write state');
            for (const [key, value] of Object.entries(expected)) {
              if (!state.counts || state.counts[key] !== value) fail(`${label}: count ${key}=${state.counts && state.counts[key]} expected ${value}`);
            }
            if (await page.locator('.hsk-pro-unit').count() !== 10) fail(label + ': unit list != 10');
            if (await page.locator('[data-pro-lesson]').count() !== 24) fail(label + ': lesson list != 24');
            if (await page.locator('[data-pro-assessment]').count() !== 13) fail(label + ': assessment list != 13');
            if (await page.locator('[data-pro-level="1"]').count() !== 1) fail(label + ': HSK1 selector missing');
            if (await page.locator('.hsk-pro-level.locked').count() !== 8) fail(label + ': HSK2-9 lock count != 8');
            return state;
          }
          async function assertNoOverflow(page, label) {
            const metrics = await page.evaluate(() => ({
              viewport: window.innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              lessonWidth: document.getElementById('hskLesson') ? document.getElementById('hskLesson').scrollWidth : null
            }));
            const overflow = metrics.documentWidth - metrics.viewport;
            if (overflow > 2) fail(label + ': document horizontal overflow ' + overflow + 'px');
            return { ...metrics, overflow };
          }
          async function assertControls(page, label, mobile) {
            const result = await page.evaluate(() => {
              const buttons = Array.from(document.querySelectorAll('#hskLesson button:not([disabled])'));
              return {
                count: buttons.length,
                minHeight: buttons.length ? Math.min(...buttons.map((b) => b.getBoundingClientRect().height)) : 0,
                maxRight: buttons.length ? Math.max(...buttons.map((b) => b.getBoundingClientRect().right)) : 0,
                minLeft: buttons.length ? Math.min(...buttons.map((b) => b.getBoundingClientRect().left)) : 0
              };
            });
            if (mobile && result.count && result.minHeight < 44) fail(label + ': touch target below 44px: ' + result.minHeight);
            if (result.maxRight > (await page.evaluate(() => window.innerWidth)) + 2 || result.minLeft < -2) fail(label + ': lesson button clipped horizontally');
            return result;
          }
          async function exerciseFlow(page, label) {
            const first = page.locator('[data-pro-exercise="hsk1-lesson-01-exercise-1"]');
            await first.waitFor();
            await first.locator('[data-pro-input-for="hsk1-lesson-01-exercise-1"]').fill('一、七、八、十');
            await first.locator('[data-pro-check="hsk1-lesson-01-exercise-1"]').click();
            await first.locator('[data-pro-feedback="hsk1-lesson-01-exercise-1"]').getByText('Đúng.', { exact: true }).waitFor();
            const explanation = await first.locator('[data-pro-feedback="hsk1-lesson-01-exercise-1"]').textContent();
            if (!explanation || !explanation.includes('Đáp án:')) fail(label + ': exercise feedback missing answer/explanation');
          }
          async function smokeViewport(browser, target, vp) {
            const label = target.name + '/' + vp.name;
            const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height }, isMobile: vp.mobile, hasTouch: vp.mobile });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            try {
              // Start at home and enter HSK through the learner-facing UI.
              await page.goto(target.base + '?recoverySmoke=1', { waitUntil: 'domcontentloaded', timeout: 45000 });
              await waitReady(page);
              const homeHsk = page.locator('[data-home-area="hsk"]').first();
              if (await homeHsk.count()) await homeHsk.click();
              await page.waitForFunction(() => document.body && document.body.getAttribute('data-current-area') === 'hsk', null, { timeout: 10000 });
              await assertCore(page, label);
              await page.locator('#hskLesson').getByText('Nghe rõ bốn thanh', { exact: true }).waitFor();
              await page.locator('#hskLesson').getByText('听清四声', { exact: true }).waitFor();
              if (await page.locator('.hsk-pro-section-vocab').count() < 1) fail(label + ': vocabulary section missing');
              if (await page.locator('.hsk-pro-grammar').count() < 1) fail(label + ': grammar section missing');
              if (await page.locator('.hsk-pro-character').count() < 1) fail(label + ': character section missing');
              if (await page.locator('.hsk-pro-transcript').count() < 1) fail(label + ': listening transcript missing');
              if (await page.locator('.hsk-pro-reading').count() < 1) fail(label + ': reading section missing');
              if (await page.locator('.hsk-pro-exercise').count() < 5) fail(label + ': lesson exercises incomplete');
              await exerciseFlow(page, label);

              await page.locator('[data-pro-next]').click();
              await page.waitForFunction(() => window.VDuckieHskProfessionalRuntime.getState().selectedLessonId === 'hsk1-lesson-02');
              await page.locator('[data-pro-prev]').click();
              await page.waitForFunction(() => window.VDuckieHskProfessionalRuntime.getState().selectedLessonId === 'hsk1-lesson-01');

              await page.locator('[data-pro-lesson="hsk1-lesson-13"]').click();
              await page.waitForFunction(() => window.VDuckieHskProfessionalRuntime.getState().selectedLessonId === 'hsk1-lesson-13');
              await page.locator('[data-pro-lesson="hsk1-lesson-24"]').click();
              await page.waitForFunction(() => window.VDuckieHskProfessionalRuntime.getState().selectedLessonId === 'hsk1-lesson-24');

              await page.locator('[data-pro-assessment="hsk1-assessment-final"]').click();
              await page.waitForFunction(() => window.VDuckieHskProfessionalRuntime.getState().selectedAssessmentId === 'hsk1-assessment-final');
              await page.locator('#hskLesson').getByText(/Final/i).first().waitFor();
              await page.locator('[data-pro-assessment="hsk1-assessment-mastery"]').click();
              await page.waitForFunction(() => window.VDuckieHskProfessionalRuntime.getState().selectedAssessmentId === 'hsk1-assessment-mastery');
              await page.locator('#hskLesson').getByText(/Mastery/i).first().waitFor();

              // Deep links must reopen real C2 content.
              await page.goto(target.base + '?area=hsk&hskLesson=hsk1-lesson-24&recoverySmoke=2', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const deepState = await waitReady(page);
              if (deepState.selectedLessonId !== 'hsk1-lesson-24') fail(label + ': lesson deep link failed');
              await page.goto(target.base + '?area=hsk&hskAssessment=hsk1-assessment-final&recoverySmoke=3', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const assessmentState = await waitReady(page);
              if (assessmentState.selectedAssessmentId !== 'hsk1-assessment-final') fail(label + ': assessment deep link failed');

              const overflow = await assertNoOverflow(page, label);
              const controls = await assertControls(page, label, vp.mobile);
              const criticalErrors = consoleErrors.filter(text => /HSK1 learner runtime|hsk-professional-runtime|course-manifest|data\/hsk\/hsk1|SyntaxError|ReferenceError/i.test(text));
              if (criticalErrors.length) fail(label + ': critical console errors: ' + criticalErrors.join(' | '));
              const screenshot = `/tmp/hsk-recovery-${target.name}-${vp.name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              return { pass: true, finalState: assessmentState, overflow, controls, consoleErrors, screenshot };
            } finally {
              await page.close();
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const target of targets) {
                report.targets[target.name] = {};
                for (const vp of viewports) {
                  try {
                    report.targets[target.name][vp.name] = await smokeViewport(browser, target, vp);
                  } catch (error) {
                    report.failures.push({ target: target.name, viewport: vp.name, error: error.stack || String(error) });
                    report.targets[target.name][vp.name] = { pass: false, error: error.stack || String(error) };
                  }
                }
              }
            } finally {
              await browser.close();
            }
            fs.writeFileSync('/tmp/hsk-recovery-smoke.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
            if (report.failures.length) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/hsk-recovery-smoke.js | tee /tmp/hsk-recovery-smoke.log

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk1-recovery-smoke-evidence
          if-no-files-found: warn
          retention-days: 5
          path: |
            /tmp/hsk-recovery-smoke.json
            /tmp/hsk-recovery-smoke.log
            /tmp/hsk-recovery-*.png
