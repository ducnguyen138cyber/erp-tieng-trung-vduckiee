name: Level 1 maintenance verification

on:
  push:
    branches:
      - agent/hsk1-c2-editorial

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover exact maintenance bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/lv1-maintenance-v109
          test "$(git rev-parse HEAD)" = "5144e40eab3d8655c432f7d1ec7970608f661ccf"
          test "$(git rev-parse origin/main)" = "5144e40eab3d8655c432f7d1ec7970608f661ccf"
          test -z "$(git status --porcelain)"
          git checkout origin/agent/lv1-maintenance-v109 -- \
            scripts/apply-lv1-maintenance-v109.js \
            assets/v109 \
            assets/vduckie/lv1/v109 \
            tests/v109-level1-evolution.test.js
          node scripts/apply-lv1-maintenance-v109.js
          rm scripts/apply-lv1-maintenance-v109.js
          git status -sb
          git diff --check

          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/build-adam-clips.yml',
              '.github/workflows/publish-adam-60.yml',
              'index.html',
              'assets/v109/level1-manifest-v109.js',
              'assets/v109/vduckie-level1-v109.js',
              'assets/v109/vduckie-level1-v109.css',
              'assets/vduckie/lv1/v109/egg-resting.svg',
              'assets/vduckie/lv1/v109/egg-first-crack.svg',
              'assets/vduckie/lv1/v109/egg-peek.svg',
              'assets/vduckie/lv1/v109/egg-ready.svg',
              'tests/v109-level1-evolution.test.js',
          }
          actual = set(subprocess.check_output(['git','status','--porcelain'], text=True).splitlines())
          actual = {line[3:] for line in actual}
          if actual != expected:
              raise SystemExit(f'Unexpected maintenance scope. expected={sorted(expected)} actual={sorted(actual)}')
          if any(path.startswith(('data/hsk/','assets/hsk-content/','assets/vduckie/lv2/','assets/vduckie/lv3/','assets/vduckie/lv4/','assets/vduckie/lv5/','assets/vduckie/lv6/','assets/vduckie/lv7/','assets/vduckie/lv8/','assets/vduckie/lv9/','assets/vduckie/lv10/')) for path in actual):
              raise SystemExit('Forbidden scope changed')
          PY

      - name: Syntax, targeted tests and full regression
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/v109/level1-manifest-v109.js
          node --check assets/v109/vduckie-level1-v109.js
          node --test tests/v109-level1-evolution.test.js
          node --test --test-concurrency=1 --test-reporter=dot tests/*.test.js | tee /tmp/lv1-regression.log
          git diff --check

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lv1-pw
          cd /tmp/lv1-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Build browser smoke script
        shell: bash
        run: |
          cat >/tmp/lv1-smoke.js <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const base = process.env.BASE_URL;
          const target = process.argv[2] || 'unknown';
          const viewports = [
            { name:'1440x900', width:1440, height:900 },
            { name:'1024x768', width:1024, height:768 },
            { name:'390x844', width:390, height:844 },
            { name:'320x568', width:320, height:568 }
          ];
          const targets = [0,25,50,75,99];
          const expected = {0:'resting',25:'first-crack',50:'peek',75:'ready',99:'ready'};
          const report = { target, base, viewports:{}, failures:[] };

          function fail(message){ throw new Error(message); }
          async function waitApp(page){
            await page.waitForFunction(() => window.VDuckieMascot && window.VDuckieProgressStore && document.querySelector('.v92-evolution-visual [data-v95-mascot]'), null, {timeout:30000});
          }
          async function expFor(page, percent){
            return page.evaluate(targetPercent => {
              let best = null;
              for(let total=0; total<=5000; total++){
                const state = window.VDuckieEXPCore.calculateUserLevel(total);
                if(state.level !== 1) break;
                const delta = Math.abs(Number(state.progressPercent)-targetPercent);
                if(!best || delta < best.delta) best={total,delta,actual:Number(state.progressPercent)};
              }
              return best;
            }, percent);
          }
          async function setProgress(page, percent){
            const match = await expFor(page, percent);
            if(!match) fail('No Level 1 EXP match for '+percent);
            await page.evaluate(total => window.VDuckieProgressStore.setFromExistingEXP(total), match.total);
            await page.waitForTimeout(120);
            return match;
          }
          async function stateOf(page){
            return page.locator('.v92-evolution-visual [data-v95-mascot]').first().evaluate(node => ({
              level:node.getAttribute('data-v95-level'),
              stage:node.getAttribute('data-v109-egg-stage'),
              progress:node.getAttribute('data-v109-egg-progress'),
              mode:node.getAttribute('data-v95-render-mode'),
              asset:node.getAttribute('data-v95-resolved-asset'),
              rect:node.getBoundingClientRect().toJSON(),
              documentWidth:document.documentElement.scrollWidth,
              viewport:window.innerWidth,
              images:Array.from(node.querySelectorAll('img')).map(img=>({src:img.currentSrc||img.src,complete:img.complete,width:img.naturalWidth,height:img.naturalHeight}))
            }));
          }
          async function assertStage(page, percent){
            const match=await setProgress(page, percent);
            const first=await stateOf(page);
            if(first.level!=='1') fail(percent+': expected Level 1, got '+first.level);
            if(first.stage!==expected[percent]) fail(percent+': expected '+expected[percent]+' got '+first.stage);
            if(first.mode!=='svg-sequence-v109') fail(percent+': wrong render mode '+first.mode);
            if(first.documentWidth-first.viewport>2) fail(percent+': horizontal overflow '+(first.documentWidth-first.viewport));
            if(first.images.some(img=>!img.complete||img.width<=0||img.height<=0)) fail(percent+': missing Level 1 asset');
            await page.waitForTimeout(650);
            const second=await stateOf(page);
            if(Math.abs(first.rect.width-second.rect.width)>1||Math.abs(first.rect.height-second.rect.height)>1) fail(percent+': layout shift');
            return {requested:percent,exp:match,state:first};
          }
          async function transition(page){
            const host=await page.evaluate(() => {
              const node=document.createElement('div');
              node.id='v109-smoke-host';
              node.style.cssText='position:fixed;left:12px;bottom:12px;width:min(520px,calc(100vw - 24px));height:auto;z-index:9999;background:#f5f1e8';
              node.innerHTML=window.VDuckieMascot.render({level:1,progressPercent:99,animationState:'hatching',size:'large'});
              document.body.appendChild(node);
              window.VDuckieMascot.hydrate(node);
              return true;
            });
            if(!host) fail('transition host failed');
            const locator=page.locator('#v109-smoke-host [data-v95-mascot]');
            const before=await locator.boundingBox();
            await page.waitForTimeout(1550);
            const after=await locator.boundingBox();
            if(!before||!after||Math.abs(before.width-after.width)>1||Math.abs(before.height-after.height)>1) fail('hatch transition layout shift');
            const previewOpacity=await page.locator('#v109-smoke-host .v109-hatch-preview').evaluate(node=>Number(getComputedStyle(node).opacity));
            if(previewOpacity<0.9) fail('Level 2 preview did not arrive');
            const final=await page.evaluate(() => {
              const host=document.getElementById('v109-smoke-host');
              host.innerHTML=window.VDuckieMascot.render({level:1,progressPercent:100,animationState:'idle',size:'large'});
              window.VDuckieMascot.hydrate(host);
              const node=host.querySelector('[data-v95-mascot]');
              return {level:node.getAttribute('data-v95-level'),origin:node.getAttribute('data-v109-origin-level'),asset:node.getAttribute('data-v95-resolved-asset')};
            });
            if(final.level!=='2'||final.origin!=='1') fail('100% did not delegate to Level 2');
            if(!/lv2\/duckling-sprite-v103\.webp/.test(final.asset||'')) fail('100% did not use current Level 2 asset: '+final.asset);
            await page.locator('#v109-smoke-host').evaluate(node=>node.remove());
            return {before,after,final};
          }
          async function reloadDeterminism(page){
            await setProgress(page,50);
            const before=await stateOf(page);
            await page.reload({waitUntil:'domcontentloaded'});
            await waitApp(page);
            await setProgress(page,50);
            const after=await stateOf(page);
            if(before.stage!=='peek'||after.stage!=='peek') fail('reload did not derive same EXP stage');
            return {before:before.stage,after:after.stage};
          }
          async function runViewport(browser,vp){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},isMobile:vp.width<500,hasTouch:vp.width<500,reducedMotion:'no-preference'});
            const page=await context.newPage();
            const consoleErrors=[];
            page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text())});
            try{
              await page.goto(base+'?lv1Maintenance='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              await waitApp(page);
              const stages=[];
              for(const percent of targets) stages.push(await assertStage(page,percent));
              const transitionResult=await transition(page);
              const reload=await reloadDeterminism(page);
              await setProgress(page,75);
              const mascot=page.locator('.v92-evolution-visual [data-v95-mascot]').first();
              const hoverBefore=await mascot.boundingBox();
              if(vp.width>=500) await mascot.hover(); else await mascot.tap();
              await page.waitForTimeout(120);
              const hoverDuring=await mascot.boundingBox();
              await page.waitForTimeout(1200);
              const hoverAfter=await mascot.boundingBox();
              for(const box of [hoverDuring,hoverAfter]) if(!box||Math.abs(box.width-hoverBefore.width)>1||Math.abs(box.height-hoverBefore.height)>1) fail('hover/tap changed container size');
              const critical=consoleErrors.filter(text=>/v109|Level 1 egg renderer|egg-(resting|first-crack|peek|ready)\.svg|VDuckie mascot/i.test(text));
              if(critical.length) fail('critical console errors: '+critical.join(' | '));
              const screenshot=`/tmp/lv1-${target}-${vp.name}.png`;
              await page.screenshot({path:screenshot,fullPage:true});
              return {pass:true,stages,transition:transitionResult,reload,consoleErrors,screenshot};
            }finally{await context.close()}
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const vp of viewports){
                try{report.viewports[vp.name]=await runViewport(browser,vp)}
                catch(error){report.failures.push({viewport:vp.name,error:error.stack||String(error)});report.viewports[vp.name]={pass:false,error:error.stack||String(error)}}
              }
            }finally{await browser.close()}
            fs.writeFileSync(`/tmp/lv1-${target}.json`,JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
            if(report.failures.length)process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Local four-viewport smoke
        shell: bash
        env:
          NODE_PATH: /tmp/lv1-pw/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lv1-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4173/ node /tmp/lv1-smoke.js local

      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5144e40eab3d8655c432f7d1ec7970608f661ccf"
          git config user.name "VDuckie Maintenance Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- \
            .github/workflows/build-adam-clips.yml \
            .github/workflows/publish-adam-60.yml \
            index.html \
            assets/v109 \
            assets/vduckie/lv1/v109 \
            tests/v109-level1-evolution.test.js
          git diff --cached --check
          git commit -m "Polish Level 1 egg evolution and retire temporary workflows"
          git push origin HEAD:main
          git rev-parse HEAD | tee /tmp/lv1-main-sha.txt

      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if curl -fsS "https://vduckie.pages.dev/assets/v109/vduckie-level1-v109.js?v=109.0&attempt=$i" | grep -q '__VDUCKIE_LEVEL1_RENDERER_V109__'; then
              echo "Production contains V109"
              exit 0
            fi
            sleep 5
          done
          echo "Production did not expose V109 within timeout"
          exit 1

      - name: Production four-viewport smoke
        shell: bash
        env:
          NODE_PATH: /tmp/lv1-pw/node_modules
        run: |
          set -euo pipefail
          BASE_URL=https://vduckie.pages.dev/ node /tmp/lv1-smoke.js production

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level1-v109-maintenance-evidence
          retention-days: 5
          if-no-files-found: warn
          path: |
            /tmp/lv1-*.json
            /tmp/lv1-*.log
            /tmp/lv1-*.png
            /tmp/lv1-main-sha.txt
