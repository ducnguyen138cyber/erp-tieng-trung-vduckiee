name: Shadowing HSK2–3 Acceptance
on:
  pull_request:
    paths:
      - 'data/shadowing/**'
      - 'assets/hsk-content/hsk-shadowing-*'
      - 'tests/hsk-shadowing-*'
      - '.github/workflows/shadowing-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadowing:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Source coverage, old progress mappings and PWA compatibility
        run: node --test tests/hsk-shadowing-v1.test.mjs tests/hsk-shadowing-complete.test.mjs tests/pwa.test.js tests/sidebar-service-worker.test.js
      - name: Desktop/mobile practice and synthetic recording
        run: node tests/hsk-shadowing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadowing-hsk23-acceptance
          path: artifacts/shadowing/
          if-no-files-found: warn
