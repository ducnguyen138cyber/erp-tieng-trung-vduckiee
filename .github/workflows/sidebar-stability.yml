name: Sidebar stability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sidebar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Cache, auth, EXP, daily learning and layout unit regressions
        run: node --test tests/remove-roast-mode.test.js tests/curriculum.test.js tests/sidebar-service-worker.test.js tests/pwa.test.js tests/v90-exp-level-weekly.test.js tests/supabase-sync.test.js tests/daily-learning.test.js tests/v91.10-three-column-layout.test.js tests/v81-account-progress-sync.test.js tests/v82-account-learning-sync.test.js
      - name: Guest and mocked authenticated real Chromium clicks
        run: node tests/sidebar-browser.mjs
      - name: Exclusive screen navigation and history in Chromium
        run: node tests/screen-routing-browser.mjs
      - name: Curriculum flow, persistence and responsive browser regressions
        run: node tests/curriculum-browser.mjs

      - name: Upload browser navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-routing-screenshots
          path: artifacts/sidebar-routing/
          if-no-files-found: ignore
