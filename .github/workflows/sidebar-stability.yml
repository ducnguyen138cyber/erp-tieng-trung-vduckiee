name: Sidebar stability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sidebar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Cache, auth, EXP, daily learning and layout unit regressions
        run: node --test tests/hsk-practice-v1.test.mjs tests/hsk-phase2-exp-regression.test.mjs tests/hsk-study-journey-v1.test.mjs tests/seo-discovery.test.mjs tests/hsk-rail-mascot-stability.test.mjs tests/remaining-interface-polish.test.mjs tests/brand-runtime.test.mjs tests/blue-edtech-legacy-purge.test.mjs tests/ranking-hsk-review-visibility.test.mjs tests/duckie-tutor-quality-v2.test.mjs tests/duckie-chat-followup-context.test.mjs tests/duckie-chat-hanzi-validation.test.mjs tests/duckie-chat.test.js tests/free-learning-assistant.test.js tests/header-chinese-search.test.js tests/graded-hsk-direct-load.test.js tests/graded-hsk-entry.test.js tests/hsk-focus-learning.test.js tests/hsk-clean-learner-ui.test.js tests/remove-roast-mode.test.js tests/curriculum.test.js tests/sidebar-service-worker.test.js tests/pwa.test.js tests/v90-exp-level-weekly.test.js tests/supabase-sync.test.js tests/daily-learning.test.js tests/v91.10-three-column-layout.test.js tests/v81-account-progress-sync.test.js tests/v82-account-learning-sync.test.js
      - name: VDuckie auth desktop and mobile browser scenarios
        run: node tests/auth-screen-browser.mjs
      - name: Header Chinese search actual Chromium interactions
        run: node tests/header-search-browser.mjs
      - name: Painted theme across all learning screens
        run: node tests/brand-runtime-browser.mjs
      - name: Confirm previous deployment Network, Service Worker and Cache
        if: always()
        env:
          VISUAL_BASE_URL: https://e619e492.vduckie.pages.dev/
          VISUAL_OBSERVE_ONLY: "1"
        run: node tests/brand-runtime-browser.mjs
      - name: Blue EdTech theme responsive browser snapshots
        run: node tests/blue-edtech-browser.mjs
      - name: Duckie Chat desktop and mobile UI with mocked AI
        run: node tests/duckie-chat-browser.mjs
      - name: Guest and mocked authenticated real Chromium clicks
        run: node tests/sidebar-browser.mjs
      - name: Exclusive screen navigation and history in Chromium
        run: node tests/screen-routing-browser.mjs
      - name: Curriculum flow, persistence and responsive browser regressions
        run: node tests/curriculum-browser.mjs

      - name: Upload browser navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-routing-screenshots
          path: |
            artifacts/sidebar-routing/
            artifacts/blue-edtech/
            artifacts/brand-runtime/
          if-no-files-found: ignore
