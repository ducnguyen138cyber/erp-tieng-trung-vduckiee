name: Validate Level 1 layout fix

on:
  push:
    branches:
      - fix/level1-layout-exp-v109-3
    paths:
      - .github/workflows/lv1-layout-validate.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/level1-layout-exp-v109-3
          fetch-depth: 0

      - name: Apply production cache version
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#level1-manifest-v109.js?v=109.1#level1-manifest-v109.js?v=109.3#g' index.html
          sed -i 's#vduckie-level1-v109.js?v=109.1#vduckie-level1-v109.js?v=109.3#g' index.html
          sed -i 's#vduckie-level1-v109.css?v=109.1#vduckie-level1-v109.css?v=109.3#g' index.html
          grep -q 'level1-manifest-v109.js?v=109.3' index.html
          grep -q 'vduckie-level1-v109.js?v=109.3' index.html
          grep -q 'vduckie-level1-v109.css?v=109.3' index.html
          ! grep -q 'v109.*109.1' index.html

      - name: Run targeted source tests
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/v109/level1-manifest-v109.js
          node --check assets/v109/vduckie-level1-v109.js
          node --check tests/v109-level1-evolution.test.js
          node --test tests/v109-level1-evolution.test.js

      - name: Run mascot and evolution regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -iname '*mascot*.test.js' -o -iname '*evolution*.test.js' -o -iname '*v109*.test.js' \) | sort -u)
          printf 'Regression files (%s):\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          node --test "${files[@]}"

      - name: Check final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --check origin/main...HEAD
          changed=$(git diff --name-only origin/main...HEAD; git diff --name-only)
          printf '%s\n' "$changed" | sort -u
          forbidden=$(printf '%s\n' "$changed" | grep -E '(^|/)(lv2|lv3|lv4|lv5|lv6|lv7|lv8|lv9|lv10)(/|\.)|assets/v9[7-9]/|assets/v10[0-6]/' || true)
          test -z "$forbidden"

      - name: Commit cache update and remove temporary workflow
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lv1-layout-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/lv1-layout-validate.yml
          git commit -m 'Finalize Level 1 layout validation'
          git push origin HEAD:fix/level1-layout-exp-v109-3
