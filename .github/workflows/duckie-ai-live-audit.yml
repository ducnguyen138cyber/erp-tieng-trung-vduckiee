name: Duckie AI Quality Live Audit
on:
  pull_request:
    paths:
      - 'functions/api/duckie-chat.js'
      - 'tests/duckie-ai-production-audit.mjs'
      - 'tests/duckie-tutor-quality-v2.test.mjs'
      - '.github/workflows/duckie-ai-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests for source-based vocabulary safeguards
        run: node --test tests/duckie-tutor-quality-v2.test.mjs
      - name: Spot check 4 actual production AI responses without credentials
        run: node tests/duckie-ai-production-audit.mjs
      - name: Upload bounded raw answers and pass/inconclusive statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckie-ai-live-quality
          path: artifacts/ai-quality/
          if-no-files-found: warn
